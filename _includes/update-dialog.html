<dialog id="updateDialog" aria-labelledby="updateTitle" class="w-[calc(100%-2rem)] max-w-sm m-auto rounded-2xl border border-slate-200 bg-white p-5 text-slate-900 shadow-xl backdrop:bg-slate-900/50">
    <h2 id="updateTitle" class="text-lg font-bold">Update available</h2>
    <p id="updateVersion" class="mt-1 text-sm font-medium text-indigo-700"></p>
    <ul id="updateNotes" class="mt-3 list-disc space-y-1 pl-5 text-sm text-slate-600"></ul>
    <div class="mt-5 flex justify-end gap-2">
      <button id="cancelUpdateBtn" type="button" autofocus class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50">Cancel</button>
      <button id="applyUpdateBtn" type="button" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Update</button>
    </div>
  </dialog>
